global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'openedge-docker'
    environment: 'production'

scrape_configs:
  # OpenTelemetry Collector metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          service: 'otel-collector'
  
  # OpenTelemetry Collector Prometheus exporter
  - job_name: 'openedge-metrics'
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          service: 'openedge'
  
  # Traefik metrics
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8082']
        labels:
          service: 'traefik'
  
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Docker containers (if Docker metrics are exposed)
  - job_name: 'docker'
    static_configs:
      - targets: ['host.docker.internal:9323']
        labels:
          service: 'docker'
