[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

# =============================================================================
# PASOE Instance 1 Logs
# =============================================================================
[INPUT]
    Name              tail
    Path              /var/log/pasoe1/*.log
    Tag               pasoe1.*
    Parser            pasoe_log
    DB                /var/log/fluent-bit/pasoe1.db
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Refresh_Interval  10

# =============================================================================
# PASOE Instance 2 Logs
# =============================================================================
[INPUT]
    Name              tail
    Path              /var/log/pasoe2/*.log
    Tag               pasoe2.*
    Parser            pasoe_log
    DB                /var/log/fluent-bit/pasoe2.db
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Refresh_Interval  10

# =============================================================================
# Database Logs
# =============================================================================
[INPUT]
    Name              tail
    Path              /var/log/db/*.log
    Tag               database.*
    Parser            db_log
    DB                /var/log/fluent-bit/db.db
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Refresh_Interval  10

# =============================================================================
# Filters - Transform to OpenTelemetry Format
# =============================================================================
[FILTER]
    Name                modify
    Match               pasoe1.*
    Add                 service.name oe-web-api-pasoe
    Add                 service.instance.id pasoe-instance-1
    Add                 deployment.environment docker
    Add                 service.namespace openedge

[FILTER]
    Name                modify
    Match               pasoe2.*
    Add                 service.name oe-web-api-pasoe
    Add                 service.instance.id pasoe-instance-2
    Add                 deployment.environment docker
    Add                 service.namespace openedge

[FILTER]
    Name                modify
    Match               database.*
    Add                 service.name sports2020-database
    Add                 service.instance.id sports2020-db
    Add                 deployment.environment docker
    Add                 service.namespace openedge
    Add                 db.system openedge

# Add timestamp in OpenTelemetry format
[FILTER]
    Name                lua
    Match               *
    script              /fluent-bit/etc/otel_transform.lua
    call                add_otel_timestamp

# =============================================================================
# Output - Send to OpenTelemetry Collector
# =============================================================================
[OUTPUT]
    Name                http
    Match               *
    Host                otel-collector
    Port                4318
    URI                 /v1/logs
    Format              json
    Json_date_key       timestamp
    Json_date_format    iso8601
    Header              Content-Type application/json
    Retry_Limit         3
    net.keepalive       on
    net.keepalive_idle_timeout 30

# Optional: Output to stdout for debugging
[OUTPUT]
    Name                stdout
    Match               *
    Format              json_lines
