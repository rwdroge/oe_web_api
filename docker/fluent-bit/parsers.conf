[PARSER]
    Name        pasoe_log
    Format      regex
    Regex       ^\[(?<timestamp>[^\]]+)\]\s+(?<level>[A-Z]+)\s+(?<thread>[^\s]+)\s+(?<logger>[^\s]+)\s+-\s+(?<message>.*)$
    Time_Key    timestamp
    Time_Format %Y-%m-%d %H:%M:%S,%L
    Time_Keep   On

[PARSER]
    Name        db_log
    Format      regex
    Regex       ^\[(?<timestamp>[^\]]+)\]\s+(?<pid>\d+)\s+(?<level>[A-Z]+)\s+(?<area>[^\s]+)\s+(?<message>.*)$
    Time_Key    timestamp
    Time_Format %Y-%m-%d %H:%M:%S
    Time_Keep   On

[PARSER]
    Name        json
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L
    Time_Keep   On

[PARSER]
    Name        apache
    Format      regex
    Regex       ^(?<host>[^ ]*) [^ ]* (?<user>[^ ]*) \[(?<time>[^\]]*)\] "(?<method>\S+)(?: +(?<path>[^\"]*?)(?: +\S*)?)?" (?<code>[^ ]*) (?<size>[^ ]*)(?: "(?<referer>[^\"]*)" "(?<agent>[^\"]*)")?$
    Time_Key    time
    Time_Format %d/%b/%Y:%H:%M:%S %z

[PARSER]
    Name        catalina
    Format      regex
    Regex       ^(?<timestamp>\d{2}-\w{3}-\d{4}\s+\d{2}:\d{2}:\d{2}\.\d{3})\s+(?<level>[A-Z]+)\s+\[(?<thread>[^\]]+)\]\s+(?<logger>[^\s]+)\s+(?<message>.*)$
    Time_Key    timestamp
    Time_Format %d-%b-%Y %H:%M:%S.%L
    Time_Keep   On
