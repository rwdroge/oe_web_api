# OpenTelemetry Collector Configuration for Docker Environment
# Receives telemetry from PASOE instances, database, and Traefik

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 8
        max_concurrent_streams: 100
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "*"

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024
    send_batch_max_size: 2048
  
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  
  resource:
    attributes:
      - key: service.namespace
        value: "openedge"
        action: upsert
      - key: deployment.environment
        value: "docker"
        action: upsert
  
  attributes:
    actions:
      - key: db.system
        value: "openedge"
        action: upsert

exporters:
  # Export to Jaeger for trace visualization
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  
  # Export to Prometheus
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "openedge"
    const_labels:
      environment: "docker"
  
  # File exporters for persistence
  
  # Export to Elasticsearch (traces, logs, and metrics)
  elasticsearch:
    endpoints: ["http://elasticsearch:9200"]
    user: "elastic"
    password: "rubendroge"
    logs_index: otel-logs
    traces_index: otel-traces
    metrics_index: otel-metrics
    mapping:
      mode: ecs
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 1000
    retry:
      enabled: true
      initial_interval: 100ms
      max_interval: 30s
  
  # Debug exporter for debugging (replaces deprecated logging exporter)
  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 200

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource, attributes]
      exporters: [otlp/jaeger, elasticsearch]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [elasticsearch]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [elasticsearch]

  telemetry:
    logs:
      level: info
      development: false
      encoding: json
      output_paths:
        - stdout
    metrics:
      level: detailed

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  
  pprof:
    endpoint: 0.0.0.0:1777
  
  zpages:
    endpoint: 0.0.0.0:55679
