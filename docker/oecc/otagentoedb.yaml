# OECC Agent OpenTelemetry Configuration for OpenEdge Database
# This file configures the OECC agent to collect performance metrics from
# OpenEdge databases and export them to the OpenTelemetry Collector

exporter:
  # OpenTelemetry exporter configuration
  name: "otlp"
  endpoint: "http://otel-collector:4317"
  protocol: "grpc"
  timeout: 10
  connectionretry: 20

# OpenEdge database instances to monitor
oedbInstances:
  - dbname: sports2020
    host: localhost
    port: 10001
    user: sysprogress
    password: sysprogress
    metricsregex: 
    otherdbconnparams: 
    dbschedule: 60
    dbduration: SECONDS
