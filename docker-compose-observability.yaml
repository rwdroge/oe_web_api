version: '3.8'

# OpenTelemetry Collector for File Export
# Exports telemetry data to OTLP/JSON files for MongoDB persistence
# Optional observability services (Jaeger, Prometheus, Grafana) are commented out

services:
  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./conf/otel-collector-config.yaml:/etc/otel-collector-config.yaml
      - ./logs/otel:/var/log/otel
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus metrics exposed by the collector
      - "8889:8889"   # Prometheus exporter
      - "13133:13133" # Health check
      - "55679:55679" # zPages
    restart: unless-stopped

  # ============================================================================
  # Optional Observability Services (commented out)
  # Uncomment these services if you want to enable Jaeger, Prometheus, Grafana
  # ============================================================================

