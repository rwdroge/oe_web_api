name: ABL Unit Tests

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  checkout:
    name: Checkout code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Cache progress.cfg
        uses: actions/cache@v4
        env:
          cache-name: cache-progress-cfg
        with:
          path: ${{ github.workspace }}/license
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/license/progress.cfg') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
      - name: Get correct progress.cfg (to mount into the container) # using different response files for different containers
        run: |
          echo fetching progress.cfg from secret PROGRESS_CFG_128
          echo "${{ secrets['PROGRESS_CFG_128'] }}" | base64 --decode > ${{ github.workspace }}/license/progress.cfg
          ls ${{ github.workspace }}/license
  

  test:
    name: Run ABL Unit Tests
    runs-on: ubuntu-latest
    container:
      image: progressofficial/oe_compiler:12.8.7
      options: --user root -v ${{ github.workspace }}/license/progress.cfg:/usr/dlc/progress.cfg
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      env:
        DLC: /usr/dlc
        JAVA_HOME: /opt/java/openjdk
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Gradle Wrapper
        run: |
          # Create Gradle wrapper files
          mkdir -p gradle/wrapper
          echo 'distributionBase=GRADLE_USER_HOME' > gradle/wrapper/gradle-wrapper.properties
          echo 'distributionPath=wrapper/dists' >> gradle/wrapper/gradle-wrapper.properties
          echo 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.2.1-bin.zip' >> gradle/wrapper/gradle-wrapper.properties
          echo 'zipStoreBase=GRADLE_USER_HOME' >> gradle/wrapper/gradle-wrapper.properties
          echo 'zipStorePath=wrapper/dists' >> gradle/wrapper/gradle-wrapper.properties
          
          # Create gradlew script
          echo '#!/bin/sh' > gradlew
          echo 'exec java -Dorg.gradle.appname=gradlew $JAVA_OPTS -classpath "/usr/dlc/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"' >> gradlew
          chmod +x gradlew
      
      - name: Set up OpenEdge environment
        run: |
          echo "dlcHome=/usr/dlc" > gradle.properties
          echo "apply plugin: 'progress.openedge.abl-base'" > init.gradle
          echo "apply plugin: 'progress.openedge.abl-test'" >> init.gradle
      
      - name: Create sports2020 database
        run: |
          # Create the database directory
          mkdir -p build/db/sports2020
          
          # Copy the sports2020 database from DLC
          cp -r /usr/dlc/sports2020/* build/db/sports2020/
      
      - name: Run ABL Unit Tests
        run: |
          ./gradlew runUnitTests --init-script init.gradle --info
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results
