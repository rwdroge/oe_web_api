# OpenTelemetry Collector Configuration
# For receiving telemetry from OpenEdge PASOE and Database

receivers:
  # OTLP receiver for traces, metrics, and logs
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 4
        max_concurrent_streams: 100
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "*"

processors:
  # Batch processor to reduce number of outgoing connections
  batch:
    timeout: 10s
    send_batch_size: 1024
    send_batch_max_size: 2048
  
  # Memory limiter to prevent OOM
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  
  # Resource processor to add/modify resource attributes
  resource:
    attributes:
      - key: service.namespace
        value: "openedge"
        action: upsert
      - key: deployment.environment
        value: "production"
        action: upsert
  
  # Attributes processor for span attributes
  attributes:
    actions:
      - key: db.system
        value: "openedge"
        action: upsert
  
  # Filter processor to drop unwanted telemetry
  filter:
    metrics:
      exclude:
        match_type: strict
        metric_names:
          - "internal.metric"

exporters:
  # File exporters in OTLP JSON format for MongoDB persistence service
  # Format: JSON Lines (one JSON object per line)
  # Each line contains a complete OTLP ResourceSpans/ResourceMetrics/ResourceLogs object
  file/traces:
    path: /var/log/otel/traces.jsonl
    format: json
    rotation:
      max_megabytes: 100
      max_days: 7
      max_backups: 3
  
  file/metrics:
    path: /var/log/otel/metrics.jsonl
    format: json
    rotation:
      max_megabytes: 100
      max_days: 7
      max_backups: 3
  
  file/logs:
    path: /var/log/otel/logs.jsonl
    format: json
    rotation:
      max_megabytes: 100
      max_days: 7
      max_backups: 3
  
  # ============================================================================
  # Alternative exporters (commented out for potential later use)
  # ============================================================================
  
  # # Export to Jaeger for distributed tracing UI
  # otlp/jaeger:
  #   endpoint: localhost:4317
  #   tls:
  #     insecure: true
  #   sending_queue:
  #     enabled: true
  #     num_consumers: 10
  #     queue_size: 1000
  #   retry_on_failure:
  #     enabled: true
  #     initial_interval: 5s
  #     max_interval: 30s
  #     max_elapsed_time: 300s
  
  # # Prometheus exporter for metrics
  # prometheus:
  #   endpoint: "0.0.0.0:8889"
  #   namespace: "openedge"
  #   const_labels:
  #     environment: "production"
  #   send_timestamps: true
  #   metric_expiration: 5m
  
  # # Logging exporter for debugging
  # logging:
  #   loglevel: info
  #   sampling_initial: 5
  #   sampling_thereafter: 200

service:
  pipelines:
    # Traces pipeline - exports to file only
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource, attributes]
      exporters: [file/traces]
      # Alternative exporters (uncomment to enable):
      # exporters: [file/traces, otlp/jaeger, logging]
    
    # Metrics pipeline - exports to file only
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [file/metrics]
      # Alternative exporters (uncomment to enable):
      # exporters: [file/metrics, prometheus, logging]
    
    # Logs pipeline - exports to file only
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [file/logs]
      # Alternative exporters (uncomment to enable):
      # exporters: [file/logs, logging]
  
  # Collector telemetry
  telemetry:
    logs:
      level: info
      development: false
      encoding: json
      output_paths:
        - stdout
        - /var/log/otel/collector.log
    metrics:
      level: detailed
      address: 0.0.0.0:8888

extensions:
  # Health check extension
  health_check:
    endpoint: 0.0.0.0:13133
  
  # Performance profiler
  pprof:
    endpoint: 0.0.0.0:1777
  
  # zPages for debugging
  zpages:
    endpoint: 0.0.0.0:55679
