plugins {
  id 'progress.openedge.abl-base' version '2.2',
  id 'base'
}


task createSports2020(type: CreateDB){
	dbName = 'sports2020'
	sourceDb = "${dlcHome}/sports2020"
	outputDir = "${buildDir}/db/sports2020"
}

task compileCode(type: ABLCompile){
	source('AppServer')
    propath = files('AppServer')
    include('**/*.cls')
    include('**/*.p')
    include('**/*.w')
    avmOptions{
		tty.enabled = false
	}
	
	dbConnection{
		dbName="${buildDir}/db/sports2020/sports2020"
		connectionParameters = "-1"
    }
}
compileCode.dependsOn 'createSports2020'

