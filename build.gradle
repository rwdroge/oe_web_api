plugins {
	id('progress.openedge.abl-base') version '2.3.0'
	id('base')
}

abl {
	propath("${dlcHome}/src","${dlcHome}/tty","${dlcHome}/tty/netlib/OpenEdge.Net.pl","${dlcHome}/src/OpenEdge.BusinessLogic.pl")
}

task createSports2020(type: CreateDB){
	dbName = 'sports2020'
	sourceDb = "${dlcHome}/sports2020"
	outputDir = "${buildDir}/db/sports2020"
}

task compileCode(type: ABLCompile){
	source('src')
	propath("src", "${dlcHome}/tty", "${dlcHome}/tty/netlib/OpenEdge.Net.pl")
	include('**/*.cls')
	include('**/*.p')
	include('**/*.w')
	avmOptions{
		tty.enabled = true
	}
	dbConnection {
		dbName="${buildDir}/db/sports2020/sports2020"
		connectionParameters = "-1"
    }
}
compileCode.dependsOn 'createSports2020'

task runUnitTests(type: ABLUnit) {
	source('src/tests')
	include('**/*Test.cls')
	propath("src", "${dlcHome}/tty", "${dlcHome}/tty/netlib/OpenEdge.Net.pl")
	dbConnection {
		dbName = "${buildDir}/db/sports2020/sports2020"
		connectionParameters = "-1"
	}
	avmOptions {
		tty.enabled = true
	}
	outputDir = file("${buildDir}/test-results")
	format = 'xml,html'
	failOnError = true
}
runUnitTests.dependsOn 'createSports2020'

test.dependsOn 'runUnitTests'
