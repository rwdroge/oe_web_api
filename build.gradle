plugins {
  id "progress.openedge.abl-base" version "2.1.1"
}

apply plugin: 'progress.openedge.abl-base'

abl { dlcHome = new File (System.getenv('DLC'))}

task compileCode(type: ABLCompile) {

    rcodedir = file("${buildDir}/rcode")
    source('AppServer')
    propath = files('AppServer')
    include('**/*.cls')
    include('**/*.p')
    include('**/*.w')

}

defaultTasks  'compileAblTask'