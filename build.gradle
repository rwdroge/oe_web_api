import progress.openedge.abl.* 
 
plugins {
  id("progress.openedge.abl") version "2.2.1"
  id "base"
}

apply plugin: 'progress.openedge.abl'

abl { dlcHome = new File (System.getenv('DLC'))}

task compileCode(type: ABLCompile) {

    destinationDir = file("${buildDir}/rcode")
    source('AppServer')
    propath = files('AppServer')
    include('**/*.cls')
    include('**/*.p')
    include('**/*.w')

}

task packageCode(type: PL){

    dependsOn compileCode

    destFile = "${buildDir}/dist/${project.name}.pl"
    baseDir = "${buildDir}/rcode"
    includes= "**/*.r"
    excludes= "**/.pct"

}

task packageSRC(type: PL){

    destFile = "${buildDir}/dist/${project.name}-SRC.pl"
    baseDir = "AppServer"

}

task ablTest(type: ABLUnit) {

    dependsOn packageCode

    source("src/test/abl")
    include("**/*.cls")
    destinationDir = "${buildDir}/tests"
    writeLog = true
    baseDir = "${buildDir}"

    propath = files("src/test/abl" , "${buildDir}/dist/${project.name}.pl")

}

defaultTasks  'compileAblTask'