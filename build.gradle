plugins {
	id("progress.openedge.abl-base") version "2.3.0"	
}

abl {
	propath("${dlcHome}/src","${dlcHome}/tty","${dlcHome}/tty/netlib/OpenEdge.Net.pl","${dlcHome}/tty/OpenEdge.BusinessLogic.pl","${dlcHome}/tty/ablunit.pl")
}

task createSports2020(type: CreateDB){
	dbName = 'sports2020'
	sourceDb = "${dlcHome}/sports2020"
	outputDir = "${buildDir}/db/sports2020"
}

task compileCode(type: ABLCompile){
	source('src')
	propath("./src", ".", "${dlcHome}/tty", "${DLC}/tty/ablunit.pl", "${dlcHome}/tty/netlib/OpenEdge.Net.pl", "${dlcHome}/tty/OpenEdge.BusinessLogic.pl")
	include('**/*.cls')
	include('**/*.p')
	include('**/*.w')
	avmOptions{
		tty.enabled = true
	}
	dbConnection {
		dbName="${buildDir}/db/sports2020/sports2020"
		connectionParameters = "-1"
    }
}
compileCode.dependsOn 'createSports2020'

task runUnitTests(type: ABLUnit) {
	source('src/tests')
	include('**/*Test.cls')
	propath("src", "${dlcHome}/tty", "${dlcHome}/tty/netlib/OpenEdge.Net.pl", "${dlcHome}/tty/OpenEdge.BusinessLogic.pl", "${dlcHome}/tty/ablunit.pl")
	dbConnection {
		dbName = "${buildDir}/db/sports2020/sports2020"
		connectionParameters = "-1"
	}
	avmOptions {
		tty.enabled = true
	}
	outputDir = file("${buildDir}/test-results")
	// format property removed as it's not supported in this plugin version
	// failOnError = true
}
runUnitTests.dependsOn 'createSports2020', 'compileCode'

