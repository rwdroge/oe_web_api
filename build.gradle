plugins {
  id "progress.openedge.abl-base" version "2.1.1"
}

apply plugin: 'progress.openedge.abl-base'

abl {   
    propath("${dlcHome}/tty/")
    avmOptions {}
    compileOptions{}
    rcodeDir = file("${buildDir}/rcode"
    wrkDir = "/home/jenkins"
     
    dbConnection {
        dbName = 'sports2000'
        connectionParameters='-S 8000'
    }
}

task myDbConTask(type: DBConnection){
    id='id1'
    dbName='sports2020'
    parameterFile='pathToFile'
    aliases = ['alias1', 'alias2', 'aalias3']
}
task compileCode(type: ABLCompile) {

    source('AppServer')
    propath = files('AppServer')
    include('**/*.cls')
    include('**/*.p')
    include('**/*.w')

    dbConnection    {
        dbName = 'sports2020'
        parameterFile='pathToParameterFile'
        connectionParameters='-S 8000'
        port = '8000'
        host = 'localhost'
        username = 'admin'
        password = 'admin2'
        aliases = ['a1', 'a2']
    }
    dbConnectionReferenceId("id0")
    dbConnectionReferenceId("id1", "id2")
}
compileCode.dependsOn myDbConTask